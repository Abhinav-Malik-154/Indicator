[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.pyrefly]
# Match pytest's pythonpath=["."] so IDE type-checking resolves
# "from src.X import ..." the same way runtime does.
search_path = ["."]
