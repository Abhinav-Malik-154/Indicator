# Configuration for the BTC/USDT market-data pipeline (Phase 1).
#
# All dates are interpreted as UTC. `start_date` is inclusive; `end_date` is
# exclusive. `end_date: null` (or "today"/"now") means "up to the most recent
# fully closed candle at pull time" — the still-forming candle is never stored.

data:
  symbol: BTCUSDT
  intervals: ["1d", "1h", "30m"]
  start_date: "2020-01-01"
  end_date: null

binance:
  base_url: "https://api.binance.com"
  page_limit: 1000              # Binance hard cap per /api/v3/klines request
  request_timeout_s: 30
  max_retries: 5                # retries per page on transient errors (429/418/5xx/network)
  backoff_base_s: 1.0           # exponential backoff: base * 2**attempt, Retry-After respected
  sleep_between_requests_s: 0.25

paths:
  raw_dir: "data/raw"
  file_prefix: "btc_usdt"       # -> data/raw/btc_usdt_{interval}.parquet / .csv / .manifest.json
  processed_dir: "data/processed"  # -> data/processed/features_{interval}.parquet / .manifest.json
  models_dir: "models"          # -> models/{interval}/*.joblib + training manifest

# Feature-build windows (Phase 2). All windows are trailing and positional
# (counted in candles): a feature at candle T uses candles <= T only.
features:
  return_periods: [1, 3, 7, 14]       # log-return lookback in candles
  volatility_windows: [7, 14, 30]     # rolling std / range-mean windows
  volume_window: 20                   # rolling mean/z-score window for volume
  ma_windows: [7, 30]                 # close-vs-mean context windows
  sr_window: 30                       # support/resistance rolling high/low window
  rsi_period: 14                      # RSI lookback (Wilder's smoothed RS)
  macd:                               # MACD parameters (all EMA spans in candles)
    fast_period: 12                   # fast EMA of close
    slow_period: 26                   # slow EMA of close
    signal_period: 9                  # signal EMA of the MACD line

# Label-build settings (Phase 3). Labels use forward returns and live in a
# separate file from features; the two are joined only at training time.
labels:
  horizons: [1]               # forward-return horizon in candles; later: [1, 3, 7]
  dead_zone_pct: 0.15         # ±0.15 % — moves smaller than this are excluded (NaN)

# Modeling settings (Phase 4). The split is chronological train/validation/test
# with a no-overlap gap of `gap_candles` at each boundary; boundaries are
# defined positionally on the full joined table BEFORE any NaN row is dropped.
# Scalers are fit on the training split only.
modeling:
  intervals: ["1d"]           # intervals to train now; 1h/30m later, same code
  horizon: 1                  # which label horizon to model (must be built in Phase 3)
  split:
    train_frac: 0.70          # first 70% of rows (chronological)
    val_frac: 0.15            # next 15%; test gets the remainder
    gap_candles: 1            # rows skipped at each boundary; must be >= horizon
  confidence_threshold: 0.60  # emit a signal only if p(up) > 0.60 or < 0.40
  leak_alert_accuracy: 0.65   # out-of-sample accuracy above this => probable leak, flag loudly
  random_state: 42
  logistic_regression:
    C: 1.0                    # inverse L2 regularisation strength
    max_iter: 1000
  lightgbm:
    n_estimators: 500         # upper bound; early stopping picks the actual count
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 4
    min_child_samples: 30
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    early_stopping_rounds: 50 # stop when validation logloss stalls this many rounds
